name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (for example 0.1.0-preview.1)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Package version cannot be empty."
            exit 1
          fi

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore OrtegaLibDotNet.sln

      - name: Build
        run: dotnet build OrtegaLibDotNet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OrtegaLibDotNet.sln --configuration Release --no-build

      - name: Pack Models
        run: dotnet pack src/OrtegaLib.Models/OrtegaLib.Models.csproj --configuration Release --no-build --output artifacts -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack Notifications
        run: dotnet pack src/OrtegaLib.Notifications/OrtegaLib.Notifications.csproj --configuration Release --no-build --output artifacts -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack Telegram notifications
        run: dotnet pack src/OrtegaLib.Notifications.Telegram/OrtegaLib.Notifications.Telegram.csproj --configuration Release --no-build --output artifacts -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages-${{ env.PACKAGE_VERSION }}
          path: artifacts/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
